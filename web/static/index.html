<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quarta Asa — RPG</title>
  <meta name="description" content="RPG textual inspirado em Quarta Asa, no Quadrante dos Cavaleiros de Basgiath.">
  <link rel="icon" href="/static/emblema.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <img src="/static/emblema.svg" alt="" width="30" height="30">
      <span>Quarta Asa</span>
    </div>
    <nav class="trilha" id="trilha" aria-label="Progresso da campanha"></nav>
    <div class="controle-som" id="controle-som"></div>
  </header>

  <div class="layout" id="layout">
    <aside class="ficha" id="ficha" aria-label="Ficha do cadete"></aside>
    <main class="palco" id="palco" aria-live="polite"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript>Este jogo precisa de JavaScript.</noscript>
  <script src="/static/sons.js"></script>
  <script src="/static/dragoes.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
